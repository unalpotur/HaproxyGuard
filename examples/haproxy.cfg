global
    log /dev/log local0
    maxconn 4096
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/site.pem ssl-min-ver TLSv1.2
    acl is_api path_beg /api
    acl is_static path_beg /static
    use_backend api_servers if is_api
    use_backend static_servers if is_static
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /healthz
    server web1 10.0.0.11:8080 check weight 100
    server web2 10.0.0.12:8080 check weight 100
    server web3 10.0.0.13:8080 check backup

backend api_servers
    balance leastconn
    server api1 10.0.1.11:9000 check maxconn 200
    server api2 10.0.1.12:9000 check maxconn 200

backend static_servers
    server static1 10.0.2.11:8081

backend orphan_backend
    server old1 10.0.9.9:8000

listen stats
    bind *:8404
    stats enable
    stats uri /stats
