# Dev HAProxy instance for HAProxy Guard development.
# Exposes the Runtime API on TCP :9999 (dev only — never expose in production).
global
    log stdout format raw local0
    stats socket ipv4@0.0.0.0:9999 level admin
    stats timeout 30s

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind *:8080
    default_backend app

backend app
    balance roundrobin
    server app1 echo1:80 check
    server app2 echo2:80 check
